naftiko: 1.0.0-alpha2
info:
  label: The Cat API — Categories
  description: 'The Cat API — Categories. 1 operations. Lead operation: List Categories. Self-contained Naftiko capability
    covering one The Cat Api business surface.'
  tags:
  - The Cat Api
  - Categories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    THE_CAT_API_API_KEY: THE_CAT_API_API_KEY
capability:
  consumes:
  - type: http
    namespace: the-cat-categories
    baseUri: https://api.thecatapi.com/v1
    description: The Cat API — Categories business capability. Self-contained, no shared references.
    resources:
    - name: categories
      path: /categories
      operations:
      - name: listcategories
        method: GET
        description: List Categories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
        - name: page
          in: query
          type: integer
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.THE_CAT_API_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: the-cat-categories-rest
    port: 8080
    description: REST adapter for The Cat API — Categories. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/categories
      name: categories
      description: REST surface for categories.
      operations:
      - method: GET
        name: listcategories
        description: List Categories
        call: the-cat-categories.listcategories
        with:
          limit: rest.limit
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: the-cat-categories-mcp
    port: 9090
    transport: http
    description: MCP adapter for The Cat API — Categories. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-categories
      description: List Categories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: the-cat-categories.listcategories
      with:
        limit: tools.limit
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
